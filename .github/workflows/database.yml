name: Database Infrastructure & pgTAP Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-infrastructure:
    name: Supabase Local CLI & pgTAP Infrastructure Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 24 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm (11.18.0)
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start local Supabase container stack
        run: pnpm db:start

      - name: Reset database and replay initial migrations
        run: pnpm db:reset

      - name: Execute pgTAP infrastructure tests
        run: pnpm db:test

      - name: Verify container status
        run: pnpm db:status

      - name: Stop Supabase stack
        run: pnpm db:stop
        if: always()
