name: Quality & Monorepo Foundation Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-foundation:
    name: Monorepo Foundation Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 24 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm (11.18.0)
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Lint workspace packages (ESLint Flat Config)
        run: pnpm lint

      - name: Typecheck TypeScript project references
        run: pnpm typecheck

      - name: Run unit & component integration tests (Vitest)
        run: pnpm test

      - name: Verify Expo SDK 57 Driver App health (expo-doctor)
        run: pnpm driver:doctor

      - name: Build driver mobile bundles for Web, Android & iOS (Expo Export)
        run: pnpm driver:export

      - name: Build all workspace packages & applications (Turbo)
        run: pnpm build
